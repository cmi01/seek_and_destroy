# Public URL: https://seek-and-destroy.abacusai.cloud
# Static site served directly from the project root.
server {
    listen 80;
    server_name seek-and-destroy.vm.internal;
    root /home/ubuntu/seek-and-destroy;
    index index.html;

    # Revalidate on every load so redeploys show up without edge/browser caching.
    add_header Cache-Control "max-age=0, s-maxage=60";

    # Never serve dotfiles, the git repo, the deploy recipe, or docs/scripts.
    location ^~ /.well-known/ { }
    location ~ /\.            { return 404; }
    location ^~ /deploy/      { return 404; }
    location = /README.md     { return 404; }
    location = /serve.sh      { return 404; }

    location / { try_files $uri $uri/ =404; }
}
