# Public URL: https://seek-and-destroy.abacusai.cloud
# Static site served directly from the project root.
server {
    listen 80;
    server_name seek-and-destroy.vm.internal;
    root /home/ubuntu/seek-and-destroy;
    index index.html;

    # server_name is the INTERNAL name, so an absolute redirect would point the
    # browser at seek-and-destroy.vm.internal (unresolvable publicly). Emit
    # relative Location headers so redirects resolve against the public host.
    absolute_redirect off;

    # ── Versioned snapshots ───────────────────────────────────────────────
    # Each tagged version is reachable at /vNN/ (e.g. /v71/), served from the
    # snapshot tree built by deploy/snapshot_versions.sh. The site root (/)
    # always serves the latest (working tree). These blocks are declared BEFORE
    # the file-extension regexes below because nginx uses the first matching
    # regex location — so /v71/main.js is served here, not by the generic rules.
    #
    # Bare root (/) -> highest version (auto-generated by snapshot_versions.sh).
    # A 302 redirect, so the browser's address bar shows /vNN/ after landing.
    include /home/ubuntu/snd-versions/root_redirect.conf;

    # Redirect /vNN -> /vNN/ so the page's relative asset paths resolve.
    location ~ ^/(v[0-9]+)$ { return 301 /$1/; }

    # Serve /vNN/... from /home/ubuntu/snd-versions/vNN/... (root appends full URI).
    location ~ ^/v[0-9]+/ {
        root /home/ubuntu/snd-versions;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Assets are served straight from the working tree, so a browser holding a
    # cached copy would miss edits for hours. `no-cache` means "revalidate
    # before reuse" (NOT "never cache"): the browser revalidates on each load and
    # the origin answers 304 Not Modified when unchanged, or fresh bytes the
    # moment a file is edited. Immutable binary art can still be cached hard.
    #
    # NOTE: `add_header` does NOT inherit into a block that declares its own
    # `add_header`, so each location that needs a policy states it explicitly.
    # Ordered: nginx picks the FIRST matching regex location, so the narrower
    # immutable-asset rules must precede the generic one-shot below.
    location = /assets/graphics.pak {
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.(png|jpg|jpeg|svg|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~* \.(js|pak|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Never serve dotfiles, the git repo, the deploy recipe, or docs/scripts.
    location ^~ /.well-known/ { }
    location ~ /\.            { return 404; }
    location ^~ /deploy/      { return 404; }
    location = /README.md     { return 404; }
    location = /serve.sh      { return 404; }

    location / { try_files $uri $uri/ =404; }
}
